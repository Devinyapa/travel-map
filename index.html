<script>
/* ============================================================
   SETTINGS — the only part you need to edit.
   ============================================================ */

// File > Share > Publish to web > pick your tab > CSV > Publish, then paste here.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQx0aGX_DIMCArqpJxPSYA21Vy0TF4QTm8wz0_J9z-8OI676KmGoc0lueZzGIdCpLScr6nOP-Rjrm5g/pub?gid=0&single=true&output=csv";

// Which row of the sheet holds the column names. Data starts on the next row.
const HEADER_ROW = 2;

// Where the map opens before it knows your places.
const HOME_VIEW = { lat: 7.30, lng: 80.65, zoom: 8 };

// Pin colours. The key must match what you type in the category column.
const CATEGORY_COLOURS = {
  temple:       "#E8A33D",
  beach:        "#48B8C4",
  hike:         "#7FB069",
  waterfall:    "#5C9EAD",
  city:         "#D77A61",
  restaurant:   "#C9639A",
  hotel:        "#8E7CC3",
  museum:       "#B3925A",
  park:         "#6AA84F",
  university:   "#4F86D6",
  supermarket:  "#E4693F",
  gym:          "#A3B54A",
  mall:         "#7A9CC6",
  friends_home: "#D98CA5",
  shop:         "#C4913C",
  fuel_station: "#6E8B8B",
  fort:         "#9C6B4F",
  other:        "#9AA7A1"
};

/* Countries you want a coverage score for.
   upper/lower are what that country calls its two admin levels.
   Add another country the same way and it starts counting. */
const COVERAGE = {
  "Sri Lanka": {
    upper: "province",
    lower: "district",
    regions: {
      "Western":       ["Colombo", "Gampaha", "Kalutara"],
      "Central":       ["Kandy", "Matale", "Nuwara Eliya"],
      "Southern":      ["Galle", "Matara", "Hambantota"],
      "Northern":      ["Jaffna", "Kilinochchi", "Mannar", "Vavuniya", "Mullaitivu"],
      "Eastern":       ["Batticaloa", "Ampara", "Trincomalee"],
      "North Western": ["Kurunegala", "Puttalam"],
      "North Central": ["Anuradhapura", "Polonnaruwa"],
      "Uva":           ["Badulla", "Monaragala"],
      "Sabaragamuwa":  ["Ratnapura", "Kegalle"]
    }
  }
};

// Spellings that mean the same place, so a variant still counts.
const NAME_FIXES = {
  moneragala: "monaragala",
  mullaithivu: "mullaitivu",
  mulaitivu: "mullaitivu",
  killinochchi: "kilinochchi",
  trincomallee: "trincomalee"
};
</script>

  .pin-count {

  .leaflet-popup-content-wrapper { background: var(--ink); color: var(--paper); border-radius: 0.5rem; }

  .toggle {

  @media (max-width: 46rem) {

  @media (prefers-reduced-motion: reduce) {

</style>

<div class="panel" id="panel">
  <div class="panel-head">
    <h1>Where I've been</h1>

<script>
(function () {
  "use strict";

  const FIELDS = {
    place:    ["place_name", "place", "name"],
    country:  ["country"],
    upper:    ["province", "state", "region", "admin1"],
    lower:    ["district", "county", "prefecture", "admin2"],
    area:     ["area", "city", "city_area", "town", "suburb"],
    lat:      ["latitude", "lat"],
    lng:      ["longitude", "lng", "lon", "long"],
    category: ["category", "kind", "type"],
    date:     ["visit_date", "date", "visited"],
    withWhom: ["with_whom", "with", "companions", "people"],
    notes:    ["visit_notes", "notes", "note", "comment", "comments"],
    rating:   ["rating", "score"],
    photo:    ["photo_link", "photo", "photos", "photo_url", "link"],
    trip:     ["trip_name", "trip"]
  };

  const SAMPLE = [
    { place_name: "Sri Dalada Maligawa", country: "Sri Lanka", province: "Central",
      district: "Kandy", area: "Kandy", latitude: 7.29379, longitude: 80.64127,
      category: "temple", visit_date: "2023-04-14", with_whom: "Family", rating: "5",
      visit_notes: "Evening thevava. Arrived an hour early for a spot near the front." },
    { place_name: "Sri Dalada Maligawa", country: "Sri Lanka", province: "Central",
      district: "Kandy", area: "Kandy", latitude: 7.29379, longitude: 80.64127,
      category: "temple", visit_date: "2025-08-02", with_whom: "Chamodya, Randika",
      visit_notes: "Second time. Quieter on a weekday morning." },
    { place_name: "Sigiriya", country: "Sri Lanka", province: "Central", district: "Matale",
      latitude: 7.95700, longitude: 80.75980, category: "hike",
      visit_date: "2024-01-20", with_whom: "Brother", rating: "5",
      visit_notes: "Started at 6am to beat the heat and the queue." },
    { place_name: "Mirissa Beach", country: "Sri Lanka", province: "Southern", district: "Matara",
      latitude: 5.94480, longitude: 80.45930, category: "beach",
      visit_date: "2025-12-28", with_whom: "Friends", visit_notes: "Parrot Rock at sunset." },
    { place_name: "Diyaluma Falls", country: "Sri Lanka", province: "Uva", district: "Badulla",
      latitude: 6.73280, longitude: 81.03270, category: "waterfall",
      visit_date: "2024-07-06", with_whom: "Solo",
      visit_notes: "Upper pools are worth the climb. Slippery after rain." }
  ];

  const $ = (id) => document.getElementById(id);

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const norm = (s) => String(s || "").trim().toLowerCase()
    .replace(/[\s/\-]+/g, "_").replace(/[^a-z0-9_]/g, "");

  // "Nuwara Eliya District", "nuwara-eliya" and "NUWARA ELIYA" all become one key.
  function key(s) {
    const k = String(s || "").toLowerCase()
      .replace(/\b(district|province|state|region|county)\b/g, "")
      .replace(/[^a-z0-9]/g, "");
    return NAME_FIXES[k] || k;
  }

  function pick(row, keys) {
    for (const k of keys) if (row[k] != null && String(row[k]).trim() !== "") return String(row[k]).trim();
    return "";
  }

  function tidyRow(raw) {
    const row = {};
    for (const k in raw) row[norm(k)] = raw[k];

    const lat = parseFloat(pick(row, FIELDS.lat));
    const lng = parseFloat(pick(row, FIELDS.lng));
    if (!isFinite(lat) || !isFinite(lng)) return null;

    return {
      place: pick(row, FIELDS.place) || "Unnamed place",
      country: pick(row, FIELDS.country),
      upper: pick(row, FIELDS.upper),
      lower: pick(row, FIELDS.lower),
      area: pick(row, FIELDS.area),
      lat, lng,
      category: norm(pick(row, FIELDS.category)) || "other",
      date: pick(row, FIELDS.date),
      withWhom: pick(row, FIELDS.withWhom),
      notes: pick(row, FIELDS.notes),
      rating: pick(row, FIELDS.rating),
      photo: pick(row, FIELDS.photo),
      trip: pick(row, FIELDS.trip)
    };
  }

  function group(rows) {
    const byKey = new Map();

    rows.forEach((r) => {
      const k = norm(r.place) + "@" + r.lat.toFixed(3) + "," + r.lng.toFixed(3);
      if (!byKey.has(k)) {
        byKey.set(k, { place: r.place, country: r.country, upper: r.upper, lower: r.lower,
                       area: r.area, lat: r.lat, lng: r.lng, category: r.category, visits: [] });
      }
      byKey.get(k).visits.push(r);
    });

    const places = [...byKey.values()];
    places.forEach((p) => {
      p.visits.sort((a, b) => String(a.date).localeCompare(String(b.date)));
      p.last = p.visits[p.visits.length - 1].date || "";
      p.years = [...new Set(p.visits.map((v) => (v.date.match(/\d{4}/) || [""])[0]).filter(Boolean))];
      p.people = [...new Set(p.visits.flatMap((v) =>
        v.withWhom.split(/[,;&]/).map((s) => s.trim()).filter(Boolean)))];
    });
    places.sort((a, b) => String(b.last).localeCompare(String(a.last)));
    return places;
  }

  const colourOf = (cat) => CATEGORY_COLOURS[cat] || CATEGORY_COLOURS.other || "#9AA7A1";

  function prettyDate(d) {
    const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return d || "Date not recorded";
    return new Date(+m[1], +m[2] - 1, +m[3])
      .toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  function popupHTML(p) {
    const where = [p.area, p.lower, p.upper, p.country].filter(Boolean).join(", ");
    const total = p.visits.length;

    const visits = p.visits.map((v, i) => {
      const bits = [];
      if (v.withWhom) bits.push("With " + esc(v.withWhom));
      if (v.trip) bits.push(esc(v.trip));
      if (v.rating) bits.push(esc(v.rating) + "/5");

      return '<div class="visit">' +
        '<div class="visit-when">' + esc(prettyDate(v.date)) +
          (total > 1 ? "<small>visit " + (i + 1) + " of " + total + "</small>" : "") +
        "</div>" +
        (bits.length ? "<p>" + bits.join(" &middot; ") + "</p>" : "") +
        (v.notes ? "<p>" + esc(v.notes) + "</p>" : "") +
        (/^https?:\/\//.test(v.photo)
          ? '<p><a href="' + esc(v.photo) + '" target="_blank" rel="noopener">Open photos</a></p>' : "") +
        "</div>";
    }).join("");

    return '<div class="pop-name">' + esc(p.place) + "</div>" +
           (where ? '<div class="pop-where">' + esc(where) + "</div>" : "") + visits;
  }

  // ---------- map ----------

  const map = L.map("map", { zoomControl: false })
    .setView([HOME_VIEW.lat, HOME_VIEW.lng], HOME_VIEW.zoom);

  L.control.zoom({ position: "topright" }).addTo(map);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const cluster = L.markerClusterGroup({ maxClusterRadius: 45, showCoverageOnHover: false }).addTo(map);

  let allPlaces = [];
  const markerOf = new Map();

  function draw(places) {
    cluster.clearLayers();
    markerOf.clear();

    places.forEach((p, i) => {
      const badge = p.visits.length > 1 ? '<span class="pin-count">' + p.visits.length + "</span>" : "";

      const marker = L.marker([p.lat, p.lng], {
        title: p.place,
        icon: L.divIcon({
          className: "",
          iconSize: [17, 17],
          iconAnchor: [8, 8],
          popupAnchor: [0, -10],
          html: '<div style="position:relative"><div class="pin" style="background:' +
                colourOf(p.category) + '"></div>' + badge + "</div>"
        })
      }).bindPopup(popupHTML(p), { maxWidth: 300 });

      markerOf.set(i, marker);
      cluster.addLayer(marker);
    });

    drawList(places);
    drawTally(places);
  }

  function drawTally(places) {
    const visits = places.reduce((n, p) => n + p.visits.length, 0);
    const districts = new Set(places.filter((p) => p.lower)
      .map((p) => p.country + "/" + key(p.lower))).size;

    $("tally").innerHTML =
      "<div><b>" + places.length + "</b><span>places</span></div>" +
      "<div><b>" + visits + "</b><span>visits</span></div>" +
      "<div><b>" + districts + "</b><span>districts</span></div>";
  }

  function drawList(places) {
    const list = $("list");

    if (!places.length) {
      list.innerHTML = '<p class="notice">Nothing matches these filters. Clear them to see everything again.</p>';
      return;
    }

    list.innerHTML = places.map((p, i) => {
      const where = [p.area || p.lower, p.country].filter(Boolean).join(", ");
      const n = p.visits.length;

      return '<button class="place" data-i="' + i + '">' +
        '<span class="place-name">' +
          '<span class="dot" style="background:' + colourOf(p.category) + '"></span>' +
          esc(p.place) + (n > 1 ? '<span class="again">' + n + "&times;</span>" : "") +
        "</span>" +
        '<span class="place-meta">' + esc(where || p.category) +
          " &mdash; last " + esc(prettyDate(p.last)) + "</span></button>";
    }).join("");

    list.querySelectorAll(".place").forEach((btn) => {
      btn.addEventListener("click", () => {
        const marker = markerOf.get(+btn.dataset.i);
        if (!marker) return;
        map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 13), { duration: 0.7 });
        cluster.zoomToShowLayer(marker, () => marker.openPopup());
        if (window.matchMedia("(max-width: 46rem)").matches) showPanel(false);
      });
    });
  }

  // ---------- coverage ----------

  function drawCoverage(places) {
    const seen = new Map();

    places.forEach((p) => {
      const c = p.country || "Unlisted";
      if (!seen.has(c)) seen.set(c, { upper: new Set(), lower: new Set() });
      if (p.upper) seen.get(c).upper.add(key(p.upper));
      if (p.lower) seen.get(c).lower.add(key(p.lower));
    });

    const blocks = [...seen.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([country, got]) => {
      const cfg = COVERAGE[country];

      if (!cfg) {
        return '<details class="cov"><summary><span class="cov-line">' + esc(country) +
          "<em>" + got.lower.size + " areas in " + got.upper.size + " regions</em>" +
          "</span></summary></details>";
      }

      const all = Object.entries(cfg.regions);
      const totalLower = all.reduce((n, [, ds]) => n + ds.length, 0);
      const known = new Set(all.flatMap(([, ds]) => ds.map(key)));

      let hitLower = 0, hitUpper = 0;

      const body = all.map(([region, districts]) => {
        const chips = districts.map((d) => {
          const on = got.lower.has(key(d));
          if (on) hitLower++;
          return '<span class="chip' + (on ? " seen" : "") + '">' + esc(d) + "</span>";
        }).join("");

        const regionSeen = districts.some((d) => got.lower.has(key(d))) || got.upper.has(key(region));
        if (regionSeen) hitUpper++;

        return '<div class="region"><h3 class="' + (regionSeen ? "seen" : "") + '">' +
               esc(region) + '</h3><div class="chips">' + chips + "</div></div>";
      }).join("");

      const odd = [...got.lower].filter((k) => k && !known.has(k));
      const flag = odd.length
        ? '<p class="flag">Not on the ' + esc(cfg.lower) + " list: " + esc(odd.join(", ")) +
          ". Check the spelling in your sheet.</p>"
        : "";

      const pct = Math.round((hitLower / totalLower) * 100);

      return '<details class="cov"><summary><span class="cov-line">' + esc(country) +
        "<em>" + hitLower + " of " + totalLower + " " + esc(cfg.lower) + "s, " +
        hitUpper + " of " + all.length + " " + esc(cfg.upper) + "s</em></span>" +
        '<span class="bar"><i style="width:' + pct + '%"></i></span></summary>' +
        body + flag + "</details>";
    });

    $("coverage").innerHTML = blocks.join("");
  }

  // ---------- filters ----------

  function fillFilter(sel, values) {
    values.filter(Boolean).sort().forEach((v) => {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v.charAt(0).toUpperCase() + v.slice(1);
      sel.appendChild(o);
    });
  }

  function applyFilters() {
    const q = $("q").value.trim().toLowerCase();
    const cat = $("fCategory").value;
    const year = $("fYear").value;
    const who = $("fWith").value;
    const up = $("fUpper").value;
    const low = $("fLower").value;

    draw(allPlaces.filter((p) => {
      if (cat && p.category !== cat) return false;
      if (year && !p.years.includes(year)) return false;
      if (who && !p.people.includes(who)) return false;
      if (up && p.upper !== up) return false;
      if (low && p.lower !== low) return false;
      if (q) {
        const hay = [p.place, p.area, p.lower, p.upper, p.country, p.category,
                     ...p.visits.map((v) => v.notes + " " + v.withWhom + " " + v.trip)]
                     .join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }));
  }

  ["q", "fCategory", "fYear", "fWith", "fUpper", "fLower"]
    .forEach((id) => $(id).addEventListener("input", applyFilters));

  function showPanel(show) {
    $("panel").hidden = !show;
    $("toggle").textContent = show ? "Hide list" : "Show list";
  }

  $("toggle").addEventListener("click", () => showPanel($("panel").hidden));
  if (window.matchMedia("(max-width: 46rem)").matches) showPanel(false);

  // ---------- load ----------

  function start(rows, note) {
    const clean = rows.map(tidyRow).filter(Boolean);

    if (!clean.length) {
      $("list").innerHTML = '<p class="notice">No rows had a usable latitude and longitude. ' +
        "Check that <code>HEADER_ROW</code> matches the row your column names sit on, and that " +
        "<code>latitude</code> and <code>longitude</code> hold plain numbers.</p>";
      return;
    }

    allPlaces = group(clean);

    fillFilter($("fCategory"), [...new Set(allPlaces.map((p) => p.category))]);
    fillFilter($("fYear"), [...new Set(allPlaces.flatMap((p) => p.years))]);
    fillFilter($("fWith"), [...new Set(allPlaces.flatMap((p) => p.people))]);
    fillFilter($("fUpper"), [...new Set(allPlaces.map((p) => p.upper))]);
    fillFilter($("fLower"), [...new Set(allPlaces.map((p) => p.lower))]);

    draw(allPlaces);
    drawCoverage(allPlaces);
    map.fitBounds(L.latLngBounds(allPlaces.map((p) => [p.lat, p.lng])).pad(0.2));

    if (note) $("list").insertAdjacentHTML("afterbegin", '<p class="notice">' + note + "</p>");
  }

  function toObjects(text) {
    const rows = Papa.parse(text, { skipEmptyLines: false }).data;
    const table = rows.slice(HEADER_ROW - 1).filter((r) => r.some((c) => String(c).trim() !== ""));
    const head = (table.shift() || []).map((h) => String(h).trim());

    return table.map((cells) => {
      const row = {};
      head.forEach((h, i) => { if (h) row[h] = cells[i]; });
      return row;
    });
  }

  if (!SHEET_CSV_URL) {
    start(SAMPLE, "These are sample places. Paste your published sheet link into " +
                  "<code>SHEET_CSV_URL</code> near the top of this file to see your own.");
  } else {
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now();

    fetch(url)
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then((text) => start(toObjects(text)))
      .catch(() => {
        $("list").innerHTML = '<p class="notice">Could not read the sheet. Check that it is still ' +
          "published under File &rsaquo; Share &rsaquo; Publish to web, and that the link ends in " +
          "<code>output=csv</code>.</p>";
      });
  }
})();
</script>
